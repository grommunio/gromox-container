# Cloud cluster: LoadBalancer for the mail ports, Ingress (ingress-nginx) for
# HTTP(S), publicly trusted certificate from Let's Encrypt via cert-manager.
# HTTP-01 works because the Ingress serves the challenge; for DNS-01 the
# Ingress is optional.
grommunio:
  fqdn: mail.example.com
  domain: example.com

tls:
  mode: certManager
  certManager:
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer

ingress:
  enabled: true
  className: nginx
  controller: nginx
  # Do NOT add cert-manager.io/* annotations here: the certificate is managed by
  # the chart's own Certificate object (ingress-shim would fight over the Secret).
  # HTTP-01 challenges are solved through this Ingress automatically.
  realIpFrom:
    - 10.42.0.0/16          # pod CIDR of the ingress controller (or its node addresses)
  admin:
    enabled: true
    host: admin.mail.example.com

service:
  core:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: {}
      # service.beta.kubernetes.io/aws-load-balancer-type: nlb
      # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx

global:
  storageClass: ""        # cluster default
