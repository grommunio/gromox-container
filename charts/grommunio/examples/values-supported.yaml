# Supported edition: images built from the grommunio subscription repository.
# Pull with your grommunio subscription credentials (the same as for the
# supported package repositories). Better than putting the password here:
#   kubectl -n grommunio create secret docker-registry grommunio-registry \
#     --docker-server=container.grommunio.com \
#     --docker-username='<subscription user>' --docker-password='<secret>'
# and global.imagePullSecrets: [grommunio-registry] instead of imageCredentials.
grommunio:
  fqdn: mail.example.com
  domain: example.com

global:
  edition: supported
  imageCredentials:
    username: "<subscription user>"
    password: "change-me"
