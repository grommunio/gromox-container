{{- with .Values.global.imageCredentials }}
{{- if .username }}
{{- $auth := dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc) }}
{{- if .email }}{{- $_ := set $auth "email" .email }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grommunio.registrySecretName" $ }}
  labels:
    {{- include "grommunio.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $.Values.global.imageRegistry $auth) | toJson | b64enc }}
{{- end }}
{{- end }}
