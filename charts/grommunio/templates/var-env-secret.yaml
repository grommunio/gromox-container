{{- if not .Values.existingVarEnvSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grommunio.varEnvSecretName" . }}
  labels:
    {{- include "grommunio.labels" (dict "root" . "component" "config") | nindent 4 }}
type: Opaque
stringData:
  var.env: |
    container=docker

    FQDN={{ .Values.config.fqdn | quote }}
    DOMAIN={{ .Values.config.domain | quote }}
    ADMIN_PASS={{ .Values.config.adminPass | quote }}
    ORGANIZATION={{ .Values.config.organization | quote }}
    TIMEZONE={{ .Values.config.timezone | quote }}
    RELAYHOST={{ .Values.config.relayhost | quote }}
    LOGFILE={{ .Values.config.logfile | quote }}
    CLEAR_DBS={{ ternary "true" "false" .Values.config.clearDbs | quote }}
    FORCE_RECONFIG={{ ternary "true" "false" .Values.config.forceReconfig | quote }}
    {{- with .Values.config.x500 }}
    X500={{ . | quote }}
    {{- end }}

    MYSQL_HOST={{ include "grommunio.dbHost" (dict "root" . "key" "core") | quote }}
    MYSQL_USER={{ .Values.mariadb.databases.core.username | quote }}
    MYSQL_PASS={{ .Values.mariadb.databases.core.password | quote }}
    MYSQL_DB={{ .Values.mariadb.databases.core.database | quote }}
    MYSQL_ROOT_PASS={{ .Values.mariadb.rootPassword | quote }}

    SSL_INSTALL_TYPE={{ .Values.ssl.installType | quote }}
    SSL_COUNTRY={{ .Values.ssl.country | quote }}
    SSL_STATE={{ .Values.ssl.state | quote }}
    SSL_LOCALITY={{ .Values.ssl.locality | quote }}
    SSL_ORG={{ .Values.ssl.org | quote }}
    SSL_OU={{ .Values.ssl.ou | quote }}
    SSL_EMAIL={{ .Values.ssl.email | default (printf "admin@%s" .Values.config.domain) | quote }}
    SSL_DAYS={{ .Values.ssl.days | quote }}
    SSL_PASS={{ .Values.ssl.pass | quote }}
    {{- if .Values.features.chat.enabled }}

    CHAT_MYSQL_HOST={{ include "grommunio.dbHost" (dict "root" . "key" "chat") | quote }}
    CHAT_MYSQL_USER={{ .Values.mariadb.databases.chat.username | quote }}
    CHAT_MYSQL_PASS={{ .Values.mariadb.databases.chat.password | quote }}
    CHAT_MYSQL_DB={{ .Values.mariadb.databases.chat.database | quote }}
    CHAT_ADMIN_PASS={{ .Values.features.chat.adminPass | quote }}
    CHAT_CONFIG="/etc/grommunio-chat/config.json"
    {{- end }}
    {{- if .Values.features.files.enabled }}

    ENABLE_FILES="true"
    FILES_HOST={{ printf "%s-office" (include "grommunio.fullname" .) | quote }}
    FILES_MYSQL_HOST={{ include "grommunio.dbHost" (dict "root" . "key" "files") | quote }}
    FILES_MYSQL_USER={{ .Values.mariadb.databases.files.username | quote }}
    FILES_MYSQL_PASS={{ .Values.mariadb.databases.files.password | quote }}
    FILES_MYSQL_DB={{ .Values.mariadb.databases.files.database | quote }}
    FILES_ADMIN_PASS={{ .Values.features.files.adminPass | quote }}
    {{- end }}
    {{- if .Values.features.office.enabled }}

    ENABLE_OFFICE="true"
    OFFICE_HOST={{ printf "%s-office" (include "grommunio.fullname" .) | quote }}
    OFFICE_MYSQL_HOST={{ include "grommunio.dbHost" (dict "root" . "key" "office") | quote }}
    OFFICE_MYSQL_USER={{ .Values.mariadb.databases.office.username | quote }}
    OFFICE_MYSQL_PASS={{ .Values.mariadb.databases.office.password | quote }}
    OFFICE_MYSQL_DB={{ .Values.mariadb.databases.office.database | quote }}
    {{- end }}
    {{- if .Values.features.archive.enabled }}

    ENABLE_ARCHIVE="true"
    ARCHIVE_HOST={{ printf "%s-archive" (include "grommunio.fullname" .) | quote }}
    ARCHIVE_MYSQL_HOST={{ include "grommunio.dbHost" (dict "root" . "key" "archive") | quote }}
    ARCHIVE_MYSQL_USER={{ .Values.mariadb.databases.archive.username | quote }}
    ARCHIVE_MYSQL_PASS={{ .Values.mariadb.databases.archive.password | quote }}
    ARCHIVE_MYSQL_DB={{ .Values.mariadb.databases.archive.database | quote }}
    ARCHIVE_INDEXER_DELTA_INTERVAL={{ .Values.features.archive.indexerDeltaInterval | quote }}
    ARCHIVE_INDEXER_MAIN_INTERVAL={{ .Values.features.archive.indexerMainInterval | quote }}
    {{- end }}
    {{- if .Values.features.keycloak.enabled }}

    ENABLE_KEYCLOAK="true"
    KEYCLOAK_REALM={{ .Values.features.keycloak.realm | quote }}
    KEYCLOAK_URL={{ .Values.features.keycloak.url | quote }}
    KEYCLOAK_CLIENT_ID={{ .Values.features.keycloak.clientId | quote }}
    KEYCLOAK_CLIENT_SECRET={{ .Values.features.keycloak.clientSecret | quote }}
    {{- end }}
    {{- if .Values.config.extraVars }}

    {{- range $key, $value := .Values.config.extraVars }}
    {{ $key }}={{ $value | quote }}
    {{- end }}
    {{- end }}
{{- end }}
