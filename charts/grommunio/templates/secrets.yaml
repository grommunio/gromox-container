{{- $fullname := include "grommunio.fullname" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $s := include "grommunio.secrets" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grommunio.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grommunio.labels" . | nindent 4 }}
  annotations:
    # survives helm uninstall: the volumes do too, and the passwords stored in
    # the databases/JWT material must keep matching them
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $s }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.mariadb.enabled (not .Values.mariadb.existingRootSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grommunio.rootSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grommunio.componentLabels" (dict "root" . "component" "mariadb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MYSQL_ROOT_PASS: {{ include "grommunio.rootPassword" . | quote }}
{{- end }}
{{- if eq .Values.tls.mode "selfSigned" }}
{{- $t := include "grommunio.selfSignedTls" . | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grommunio.caSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grommunio.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $t.cacrt | b64enc }}
  tls.key: {{ $t.cakey | b64enc }}
  ca.crt: {{ $t.cacrt | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grommunio.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grommunio.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    grommunio.io/san-hash: {{ $t.sanhash | quote }}
    grommunio.io/ca-serial: {{ $t.caserial | quote }}
    grommunio.io/crt-hash: {{ $t.crthash | quote }}
    grommunio.io/not-after: {{ $t.notafter | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $t.crt | b64enc }}
  tls.key: {{ $t.key | b64enc }}
  ca.crt: {{ $t.cacrt | b64enc }}
{{- end }}
