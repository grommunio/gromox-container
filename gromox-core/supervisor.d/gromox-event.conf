[program:gromox-event]
command=/usr/libexec/gromox/event
user=gromox
autostart=true
autorestart=true
; let busy sqlite/MAPI operations finish on shutdown (pod grace period is 120s)
stopwaitsecs=60
stdout_logfile=/var/log/supervisor-gromox-event.log
stderr_logfile=/var/log/supervisor-gromox-event-err.log
