[program:grommunio-chat]
command=/usr/bin/grommunio-chat
; Same working directory as the packaged systemd unit; chat looks up i18n/ relative to it
directory=/usr/share/grommunio-chat/
autostart=false
autorestart=true
user=grochat
environment=HOME="/var/lib/grommunio-chat"
stdout_logfile=/var/log/supervisor-grommunio-chat.log
stderr_logfile=/var/log/supervisor-grommunio-chat-err.log
