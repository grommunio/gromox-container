[program:grommunio-admin-api]
; started as root so uwsgi can bind the socket in /run/grommunio and then
; drop to grommunio:nginx like the packaged systemd unit (socket mode 660
; lets nginx connect; uwsgi adds grommunio's supplementary groups gromox/gromoxcf)
command=/usr/sbin/uwsgi --ini /usr/share/grommunio-admin-api/api-config.ini --uid grommunio --gid nginx
directory=/usr/share/grommunio-admin-api
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor-grommunio-admin-api.log
stderr_logfile=/var/log/supervisor-grommunio-admin-api-err.log
