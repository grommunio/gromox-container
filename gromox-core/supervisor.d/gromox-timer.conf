[program:gromox-timer]
command=/usr/libexec/gromox/timer
user=gromox
autostart=true
autorestart=true
; let busy sqlite/MAPI operations finish on shutdown (pod grace period is 120s)
stopwaitsecs=60
stdout_logfile=/var/log/supervisor-gromox-timer.log
stderr_logfile=/var/log/supervisor-gromox-timer-err.log
