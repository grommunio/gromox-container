[program:gromox-delivery-queue]
command=/usr/libexec/gromox/delivery-queue
autostart=true
autorestart=true
; let busy sqlite/MAPI operations finish on shutdown (pod grace period is 120s)
stopwaitsecs=60
stdout_logfile=/var/log/supervisor-gromox-delivery-queue.log
stderr_logfile=/var/log/supervisor-gromox-delivery-queue-err.log
