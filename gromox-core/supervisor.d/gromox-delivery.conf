[program:gromox-delivery]
command=/usr/libexec/gromox/delivery
autostart=true
autorestart=true
; let busy sqlite/MAPI operations finish on shutdown (pod grace period is 120s)
stopwaitsecs=60
stdout_logfile=/var/log/supervisor-gromox-delivery.log
stderr_logfile=/var/log/supervisor-gromox-delivery-err.log
