[program:grommunio-archive-indexer-delta]
; Replaces the package's crontab for groarchive: delta indexing, tag/note
; indexes, temp cleanup and error counter. Interval: ARCHIVE_INDEXER_DELTA_INTERVAL.
command=/bin/bash -c "sleep 300; while true; do sudo -u groarchive /usr/libexec/grommunio-archive/indexer.delta.sh; sudo -u groarchive /usr/bin/indexer --config /etc/sphinx/sphinx.conf --quiet tag1 --rotate; sudo -u groarchive /usr/bin/indexer --config /etc/sphinx/sphinx.conf --quiet note1 --rotate; sudo -u groarchive find /var/lib/grommunio-archive/tmp -type f -name 'i.*' -mmin +60 -delete; find /var/lib/grommunio-archive/error -type f | wc -l > /var/lib/grommunio-archive/stat/error; sleep ${ARCHIVE_INDEXER_DELTA_INTERVAL:-10m}; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor-archive-indexer-delta.log
stderr_logfile=/var/log/supervisor-archive-indexer-delta-err.log
