[program:grommunio-archive-indexer-delta]
command=/bin/bash -c "sleep 300; while true; do sudo -u groarchive /usr/lib/grommunio-archive/indexer.delta.sh; sleep ${ARCHIVE_INDEXER_DELTA_INTERVAL:-10m}; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor-archive-indexer-delta.log
stderr_logfile=/var/log/supervisor-archive-indexer-delta-err.log
