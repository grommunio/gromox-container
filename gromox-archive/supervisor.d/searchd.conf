[program:searchd]
command=/usr/bin/searchd --nodetach --config /etc/sphinx/sphinx.conf
; same user as the packaged unit drop-in, so index rotation by the indexer works
user=groarchive
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor-searchd.log
stderr_logfile=/var/log/supervisor-searchd-err.log
