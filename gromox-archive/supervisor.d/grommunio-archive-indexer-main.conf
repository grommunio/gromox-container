[program:grommunio-archive-indexer-main]
; Daily housekeeping: merge delta into main index, purge expired mail,
; sign, statistics, daily report. Interval: ARCHIVE_INDEXER_MAIN_INTERVAL.
command=/bin/bash -c "sleep 600; while true; do sudo -u groarchive /usr/libexec/grommunio-archive/indexer.main.sh; sudo -u groarchive /usr/libexec/grommunio-archive/purge.sh; sudo -u groarchive /usr/bin/php /usr/libexec/grommunio-archive/sign.php --webui /usr/share/grommunio-archive/archive; sudo -u groarchive /usr/bin/php /usr/libexec/grommunio-archive/generate_stats.php --webui /usr/share/grommunio-archive/archive; sudo -u groarchive /usr/bin/php /usr/libexec/grommunio-archive/daily-report.php --webui /usr/share/grommunio-archive/archive; sleep ${ARCHIVE_INDEXER_MAIN_INTERVAL:-24h}; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor-archive-indexer-main.log
stderr_logfile=/var/log/supervisor-archive-indexer-main-err.log
