[program:cert-watch]
; Re-installs a rotated TLS secret (SSL_INSTALL_TYPE=3) and reloads the TLS
; services. Enabled by the entrypoint when CERT_WATCH=true (Kubernetes).
command=/home/common/cert-watch.sh
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor-cert-watch.log
stderr_logfile=/var/log/supervisor-cert-watch-err.log
