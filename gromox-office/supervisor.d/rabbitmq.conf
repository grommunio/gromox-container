[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
; like the packaged unit: unprivileged user, stable node name across container recreation
user=rabbitmq
directory=/var/lib/rabbitmq
environment=HOME="/var/lib/rabbitmq",RABBITMQ_NODENAME="rabbit@localhost"
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor-rabbitmq.log
stderr_logfile=/var/log/supervisor-rabbitmq-err.log
